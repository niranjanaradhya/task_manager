<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #f4f6f9;
        }

        .header {
            background: #667eea;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
        }

        .nav a {
            text-decoration: none;
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
            margin-left: 10px;
        }

        .assign { background: #4CAF50; }
        .logout { background: #e53935; }

        .container {
            padding: 30px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #667eea;
            color: white;
            padding: 12px;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        .pending {
            color: orange;
            font-weight: bold;
        }

        .completed {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="header">
    <h2>Admin Dashboard</h2>
    <div class="nav">
        <a href="/assign" class="assign">Assign Task</a>
        <a href="/logout" class="logout">Logout</a>
    </div>
</div>

<div class="container">
    <div class="card">

        <table>
            <tr>
                <th>Title</th>
                <th>Description</th>
                <th>Hours</th>
                <th>Status</th>
            </tr>

            {% for t in tasks %}
            <tr>
                <td>{{ t[1] }}</td>
                <td>{{ t[2] }}</td>
                <td>{{ t[3] }}</td>

                <td>
                    {% if t[4] == 'Completed' %}
                        <span class="completed">{{ t[4] }}</span>
                    {% else %}
                        <span class="pending">{{ t[4] }}</span>
                    {% endif %}
                </td>
                 <td>
                 <a href="/delete_task/{{t[0]}}"
                  onclick="return confirm('Are you sure you want to delete this task?')"
                  style="background:#e53935;color:white;padding:6px 10px;border-radius:5px;text-decoration:none;">
                   Delete
                        </a>
                    </td>
               </tr>
            {% endfor %}

        </table>

    </div>
</div>

</body>
</html>

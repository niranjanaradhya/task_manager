<!DOCTYPE html>
<html>
<head>
    <title>Task Manager</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            width: 350px;
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
        }

        p {
            margin-bottom: 30px;
            color: #666;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            color: white;
            font-weight: 500;
            transition: 0.3s;
        }

        .login {
            background: #4CAF50;
        }

        .signup {
            background: #2196F3;
        }

        .btn:hover {
            opacity: 0.85;
            transform: scale(1.03);
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Task Manager</h1>
    <p>Manage your tasks efficiently and stay productive</p>

    <a href="/login" class="btn login">Login</a>
    <a href="/signup" class="btn signup">Signup</a>
</div>

</body>
</html>

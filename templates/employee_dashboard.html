<!DOCTYPE html>
<html>
<head>
    <title>Employee Dashboard</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #f4f6f9;
        }

        .header {
            background: #667eea;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h2 {
            font-weight: 500;
        }

        .logout {
            text-decoration: none;
            background: #e53935;
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
            transition: 0.3s;
        }

        .logout:hover {
            opacity: 0.85;
        }

        .container {
            padding: 30px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th {
            background: #667eea;
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f1f1f1;
        }

        .status {
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
            color: white;
        }

        .pending {
            background: #ff9800;
        }

        .completed {
            background: #4CAF50;
        }

        select {
            padding: 6px;
            border-radius: 5px;
            border: 1px solid #ccc;
            margin-right: 5px;
        }

        button {
            padding: 6px 10px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #43a047;
        }
    </style>
</head>

<body>

<div class="header">
    <h2>Your Tasks</h2>
    <a href="/logout" class="logout">Logout</a>
</div>

<div class="container">
    <div class="card">

        <table>
            <tr>
                <th>Title</th>
                <th>Description</th>
                <th>Hours</th>
                <th>Status</th>
                <th>Action</th>
            </tr>

            {% for t in tasks %}
            <tr>
                <td>{{t[1]}}</td>
                <td>{{t[2]}}</td>
                <td>{{t[3]}}</td>

                <td>
                    <span class="status {% if t[4]=='Completed' %}completed{% else %}pending{% endif %}">
                        {{t[4]}}
                    </span>
                </td>

                <td>
                    <form method="POST" action="/update_status">
                        <input type="hidden" name="task_id" value="{{t[0]}}">

                        <select name="status">
                            <option>Pending</option>
                            <option>Completed</option>
                        </select>

                        <button type="submit">Update</button>
                    </form>
                </td>
            </tr>
            {% endfor %}

        </table>

    </div>
</div>

</body>
</html>
